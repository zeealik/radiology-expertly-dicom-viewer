<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="theme-color"
      content="#10171c"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="application-name"
      content="Radiology Expertly DICOM Viewer"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Radiology Expertly DICOM Viewer"
    />
    <meta
      name="msapplication-TileColor"
      content="#10171c"
    />
    <script type="text/javascript">
      console.time('scriptToView');
      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>
    <link
      rel="manifest"
      href="<%= PUBLIC_URL %>manifest.json"
    />

    <link rel="icon" type="image/svg+xml" href="<%= PUBLIC_URL %>assets/radiology-expertly.svg" />
    <link rel="shortcut icon" href="<%= PUBLIC_URL %>assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= PUBLIC_URL %>assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= PUBLIC_URL %>assets/apple-touch-icon-180x180.png" />

    <script>
      try {
        const appearance = localStorage.getItem('radiology-expertly-theme');
        const isDark = appearance !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#10171c' : '#f3f6f5';
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>

    <script
      rel="preload"
      as="script"
      type="text/javascript"
      src="<%= PUBLIC_URL %>app-config.js"
    ></script>
    <script
      rel="preload"
      as="script"
      type="module"
      src="<%= PUBLIC_URL %>init-service-worker.js"
    ></script>


    <title>Radiology Expertly DICOM Viewer</title>

    <script>
      function browserImportFunction(moduleId) {
        return import(moduleId);
      }

      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>

    <!-- EXTENSIONS -->
    <!-- <script type="text/javascript" src="path/to/some-extension.js"></script>

    <script>
      // If configuration file is a JS Object:
      window.config.extensions = [SomeExtension];

      // If configuration file is a JS Function:
      window.config = () => {
        return {
          extensions: [SomeExtension]
        };
      };
    </script> -->
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="react-portal"></div>
    <div id="root"></div>
  </body>
</html>
