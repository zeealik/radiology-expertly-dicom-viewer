version: 1
applications:
  - appRoot: platform/app
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - yarn install --frozen-lockfile
        build:
          commands:
            - APP_CONFIG=config/radiologyexpertly.js PUBLIC_URL=/ yarn build
      artifacts:
        baseDirectory: platform/app/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - platform/app/node_modules/**/*
