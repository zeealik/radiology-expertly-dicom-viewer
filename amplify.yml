version: 1
applications:
  - appRoot: platform/app
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20.19.0
            - nvm use 20.19.0
            - yarn install --frozen-lockfile
        build:
          commands:
            - NODE_ENV=production APP_CONFIG=config/radiologyexpertly.js PUBLIC_URL=/ GENERATE_SOURCEMAP=false TERSER_PARALLEL=2 yarn workspace @ohif/app build
      artifacts:
        baseDirectory: platform/app/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - platform/app/node_modules/**/*
